name: Scheduled Deploy

on:
  schedule:
    - cron: '0 19 * * *' # Setiap hari jam 02:00 WIB (19:00 UTC)
  workflow_dispatch: # Bisa trigger manual

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages Deploy
        run: |
          curl -X POST "${{ secrets.CF_DEPLOY_HOOK_URL }}"
